name: Pages

# Builds the ZeroOS browser simulator from the OS repository's main branch
# with every app from the Apps repository's main branch compiled in, writes
# the Apps tab's list (apps.json) from the same checkout, and
# publishes both to https://hartj77-blip.github.io/emu-cardputer-os.4me-u/
# Checks every 5 minutes (a few seconds of work) and only builds when the
# live site is behind either repository, so a change to ZeroOS or an app is on
# the site within about 5-15 minutes (GitHub sometimes runs schedules late).
# Run it by hand (Actions > Pages > Run workflow) to force a build.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

# Only the deploy job may publish to Pages (below); the jobs that build from
# the other repositories' code can only read.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  OS_REPO: hartj77-blip/CardPuter-OS.4ME-U
  APPS_REPO: hartj77-blip/CardPuter-Apps.4ME-U
  SITE: https://hartj77-blip.github.io/emu-cardputer-os.4me-u/

jobs:
  check:
    name: Anything new?
    runs-on: ubuntu-24.04
    outputs:
      os: ${{ steps.sha.outputs.os }}
      apps: ${{ steps.sha.outputs.apps }}
      build: ${{ steps.sha.outputs.build }}
    steps:
      - id: sha
        run: |
          os=$(git ls-remote "https://github.com/$OS_REPO.git" refs/heads/main | cut -f1)
          apps=$(git ls-remote "https://github.com/$APPS_REPO.git" refs/heads/main | cut -f1)
          live_os=$(curl -fsL "$SITE" | grep -o 'const COMMIT = "[0-9a-f]*"' | grep -o '[0-9a-f]\{40\}' || true)
          live_apps=$(curl -fsL "${SITE}apps.json" | grep -o '"commit": "[0-9a-f]*"' | grep -o '[0-9a-f]\{40\}' || true)
          echo "OS main: $os, live: ${live_os:-none}"
          echo "Apps main: $apps, live: ${live_apps:-none}"
          echo "os=$os" >> "$GITHUB_OUTPUT"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          if [ "$os" != "$live_os" ] || [ "$apps" != "$live_apps" ] || [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build the simulator
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: site-src
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ env.OS_REPO }}
          ref: ${{ needs.check.outputs.os }}
          path: os
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ env.APPS_REPO }}
          ref: ${{ needs.check.outputs.apps }}
          path: apps
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984  # v16
        with:
          version: 3.1.74
      - name: Build
        run: |
          mkdir -p site
          # build.sh stamps the page with $GITHUB_SHA; use the OS commit, not ours.
          # ZS_APPS builds the page from the Apps repository on top of this OS,
          # so every app runs in the browser, not just the OS's own.
          GITHUB_SHA=${{ needs.check.outputs.os }} ZS_APPS="$PWD/apps" os/web/build.sh "$PWD/site/index.html"
          python3 site-src/tools/apps-json.py apps site/apps.json ${{ needs.check.outputs.apps }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
